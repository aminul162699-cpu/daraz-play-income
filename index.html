<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daraz Play Income Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background: #121824;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            height: 92vh;
            max-height: 750px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header {
            background: linear-gradient(135deg, #f97316, #ea580c);
            padding: 20px 15px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 4px;
            color: white;
            font-weight: 800;
        }
        .header p {
            font-size: 12px;
            color: #ffedd5;
            font-weight: 600;
        }
        .balance-card {
            background: #1e293b;
            margin: 15px;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .balance-card p {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .balance-card h2 {
            font-size: 32px;
            color: #4ade80;
            margin-top: 6px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(74, 222, 128, 0.2);
        }
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .task-section-title {
            font-size: 18px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 6px;
        }
        .task-section-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
        .nav-bar {
            display: flex;
            background: #0f172a;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 4px 0;
        }
        .nav-item {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #f97316;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #f97316;
        }
        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>🎮 দারাজ প্লে ইনকাম সেন্টার</h1>
            <p>ভিডিও ও গেম খেলে ইনকাম করুন</p>
        </div>

        <!-- Balance Section -->
        <div class="balance-card">
            <p>আপনার মূল ব্যালেন্স</p>
            <h2>৳ <span id="balance">15.00</span></h2>
        </div>

        <!-- Main Content Area -->
        <div class="content">
            <!-- Home / Watch Section -->
            <div id="home-section" class="section active">
                <div class="task-section-title">ভিডিও টাস্ক</div>
                <div class="task-section-desc">নিচের বাটনটিতে ক্লিক করে ভিডিও দেখুন এবং ব্যালেন্স যোগ করুন।</div>
                <button class="btn btn-success" id="watch-btn" onclick="watchVideo()">▶ ভিডিও দেখুন (বোনাস পান)</button>
                <p id="timer-text" style="text-align: center; margin-top: 10px; color: #facc15; font-size: 13px; font-weight: 700;"></p>
            </div>

            <!-- Withdraw Section -->
            <div id="withdraw-section" class="section">
                <div class="task-section-title" style="margin-bottom: 12px;">টাকা উত্তোলন (Withdraw)</div>
                <label>পেমেন্ট মেথড:</label>
                <select id="method">
                    <option value="bKash">বিকাশ (bKash)</option>
                    <option value="Nagad">নগদ (Nagad)</option>
                </select>
                <label>একাউন্ট নম্বর:</label>
                <input type="text" id="account" placeholder="017xxxxxxxx">
                <label>টাকার পরিমাণ:</label>
                <input type="number" id="amount" placeholder="সর্বনিম্ন ৫০ টাকা">
                <button class="btn" onclick="requestWithdraw()">উত্তোলন রিকোয়েস্ট পাঠান</button>
            </div>

            <!-- Profile Section -->
            <div id="profile-section" class="section">
                <div class="task-section-title" style="margin-bottom: 12px;">আপনার অ্যাকাউন্ট</div>
                <label>রেফারেল লিংক:</label>
                <input type="text" value="https://t.me/DarazPlayBot?start=ref123" readonly>
                <button class="btn" onclick="alert('রেফারেল লিংক কপি করা হয়েছে!')">লিংক কপি করুন</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('home', this)">হোম</div>
            <div class="nav-item" onclick="switchTab('withdraw', this)">উইথড্র</div>
            <div class="nav-item" onclick="switchTab('profile', this)">প্রোফাইল</div>
        </div>
    </div>

    <script>
        let userBalance = 15.00;
        document.getElementById('balance').innerText = userBalance.toFixed(2);

        function switchTab(tabName, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabName + '-section').classList.add('active');
            element.classList.add('active');
        }

        function watchVideo() {
            let btn = document.getElementById('watch-btn');
            let timerText = document.getElementById('timer-text');
            btn.disabled = true;
            let countdown = 5;

            timerText.innerText = `ভিডিও লোড হচ্ছে... ${countdown} সেকেন্ড অপেক্ষা করুন`;
            
            let interval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    timerText.innerText = `দয়া করে অপেক্ষা করুন... ${countdown} সেকেন্ড`;
                } else {
                    clearInterval(interval);
                    userBalance += 2.50;
                    document.getElementById('balance').innerText = userBalance.toFixed(2);
                    timerText.innerText = "অভিনন্দন! আপনি ২.৫০ টাকা পেয়েছেন।";
                    btn.disabled = false;
                }
            }, 1000);
        }

        function requestWithdraw() {
            let acc = document.getElementById('account').value;
            let amt = document.getElementById('amount').value;
            if(acc === "" || amt === "") {
                alert("দয়া করে সঠিক তথ্য দিন!");
            } else {
                alert("আপনার উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!");
                document.getElementById('account').value = "";
                document.getElementById('amount').value = "";
            }
        }
    </script>
</body>
</html>
